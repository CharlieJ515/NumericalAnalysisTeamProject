seed = 42
n_epochs = 200

[paths]
train = "data/train.csv"
test = "data/test.csv"
out = "outputs/exp/poly_d15"
submission = "submission.csv"
loss_figure = "loss.png"
checkpoint = "ckpt.npz"
cv = "cv.json"

[model]
name = "PolynomialModel"
degree = 15
center = 5.0
scale = 5.0

[loss]
name = "MSELoss"

[optimizer]
name = "Adam"
lr = 0.01

[dataloader]
name = "MiniBatchLoader"
batch_size = 1024

[kfold]
n_splits = 5
