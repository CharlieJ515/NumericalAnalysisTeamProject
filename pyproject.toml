[project]
name = "term"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "matplotlib",
    "jaxtyping",
    "tensorflow",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "beartype",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["project", "lecture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["F722", "UP040", "UP047"]

[tool.pyright]
include = ["main.py", "src", "analysis"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
